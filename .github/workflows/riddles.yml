name: Riddle bank

# Раз на 6 годин поповнює riddles.json новими загадками й зберігає його в репозиторії.
# Гра сама підтягує файл за адресою з DEFAULT_RIDDLES_URL.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: riddle-bank
  cancel-in-progress: false

jobs:
  refill:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install google-genai

      - name: Generate riddles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # Скрипт сам зупиняється, коли вичерпано добовий ліміт, і зберігає зроблене.
        # "|| true", щоб така зупинка не рахувалась збоєм і наступний крок виконувся.
        run: timeout 25m python generate_riddles.py riddles.json 500 || true

      - name: Save riddle bank
        run: |
          git config user.name "riddle-bot"
          git config user.email "riddle-bot@users.noreply.github.com"
          git add riddles.json
          git diff --staged --quiet || (git commit -m "Refill riddle bank" && git push)
